name: release

# Every push to main runs the full test matrix; if it is green and the version
# in src/openglcontext_checks/__init__.py is not already on PyPI, a wheel and
# an sdist are built and published there by trusted publishing.
#
# A push that does not bump the version is an ordinary CI run, and bumping the
# version is what cuts a release. Nothing is published from a red build: PyPI
# versions are immutable.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  version:
    name: version
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: check
        name: Is this version already on PyPI?
        run: |
          VERSION=$(python -c "import ast, pathlib; tree = ast.parse(pathlib.Path('src/openglcontext_checks/__init__.py').read_text(encoding='utf-8')); print(next(node.value.value for node in tree.body if isinstance(node, ast.Assign) and node.targets[0].id == '__version__'))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Only 200 and 404 are answers. Anything else means PyPI did not
          # say, and guessing "not published" would turn an outage into a
          # failed upload against an immutable version.
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 \
                 "https://pypi.org/pypi/openglcontext-checks/$VERSION/json" || echo 000)
          case "$CODE" in
            200)
              echo "openglcontext-checks $VERSION is already on PyPI; nothing to publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "openglcontext-checks $VERSION is not on PyPI; it will be published."
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "PyPI answered HTTP $CODE for openglcontext-checks $VERSION; refusing to guess."
              exit 1
              ;;
          esac

  build:
    name: wheel and sdist
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Confirm the build carries the version that was checked
        env:
          EXPECTED: ${{ needs.version.outputs.version }}
        run: test -f "dist/openglcontext_checks-$EXPECTED.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ./dist/*

  publish:
    name: publish to PyPI
    needs: [tests, version, build]
    if: >-
      needs.tests.result == 'success' &&
      needs.version.outputs.publish == 'true' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC): on PyPI, add a publisher for this repository
    # with workflow `release.yml` and the environment field left blank.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
